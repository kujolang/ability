name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CI tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install pinned Kujo runtime
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0

      - name: Export Kujo runtime path
        shell: bash
        run: echo "KUJO_BIN=${{ steps.kujo.outputs.kujo-path }}" >> "$GITHUB_ENV"

      - name: Install pinned Fence
        shell: bash
        run: |
          set -euo pipefail
          fence_dir="$RUNNER_TEMP/fence"
          git clone --filter=blob:none https://github.com/kujolang/fence.git "$fence_dir"
          git -C "$fence_dir" checkout --detach fc7a000ba837050bf8bffee6252835ef0ceb55a0
          test "$(git -C "$fence_dir" rev-parse HEAD)" = "fc7a000ba837050bf8bffee6252835ef0ceb55a0"
          echo "FENCE_SCRIPT=$fence_dir/fence.kujo" >> "$GITHUB_ENV"

      - name: Verify package
        shell: bash
        run: bash scripts/verify-release.sh

  application-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install released runtime
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - name: Validate application gateway
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
          KUJO_BIN="${{ steps.kujo.outputs.kujo-path }}" bash scripts/verify-application-assurance.sh
