name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install CI tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install pinned Kujo runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kujo-v1.2.0-linux-x64.tar.gz"
          curl -fsSL \
            https://github.com/kujolang/kujo/releases/download/v1.2.0/kujo-v1.2.0-linux-x64.tar.gz \
            -o "$archive"
          echo "3f9d69779fef64c8f329c69301ac666cf74499ff083f1a5f25f729368b318fcb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/kujo-bin"
          chmod +x "$RUNNER_TEMP/kujo-bin/kujo"
          "$RUNNER_TEMP/kujo-bin/kujo" --version
          echo "KUJO_BIN=$RUNNER_TEMP/kujo-bin/kujo" >> "$GITHUB_ENV"

      - name: Install pinned Fence
        shell: bash
        run: |
          set -euo pipefail
          fence_dir="$RUNNER_TEMP/fence"
          git clone --filter=blob:none https://github.com/kujolang/fence.git "$fence_dir"
          git -C "$fence_dir" checkout --detach fc7a000ba837050bf8bffee6252835ef0ceb55a0
          test "$(git -C "$fence_dir" rev-parse HEAD)" = "fc7a000ba837050bf8bffee6252835ef0ceb55a0"
          echo "FENCE_SCRIPT=$fence_dir/fence.kujo" >> "$GITHUB_ENV"

      - name: Verify package
        shell: bash
        run: bash scripts/verify-release.sh
