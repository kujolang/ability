[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kujolang-ability-contract"
version = "1.0.0.dev1"
description = "Dependency-free Kujo Ability contract helpers"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kujolang", email = "contact@kujolang.ai" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["kujo_ability*"]
