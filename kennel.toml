[package]
name = "ability"
version = "0.2.0"
description = "Portable semantic operation contracts for the Kujo ecosystem."
license = "MIT"
authors = ["Kujolang <contact@kujolang.ai>"]
homepage = "https://github.com/kujolang/ability"
repository = "https://github.com/kujolang/ability"
documentation = "https://github.com/kujolang/ability/blob/main/README.md"
keywords = ["kujo", "ability", "contracts", "agents", "mcp"]
categories = ["ai", "developer-tools"]
readme = "README.md"

[package.status]
stage = "experimental"
stability = "unstable"
public_api = true
notes = "V1 definition contract plus experimental shared binding, exposure, invocation, policy, approval, receipt, registry, and execution primitives."

[kujo]
minimum_version = "0.1.0"
entry = "src/index.kujo"
sources = ["src"]
includes = ["README.md", "docs", "schema", "tests", "examples", "fence.toml"]
excludes = [".git", "kennel_packages", "dist", "build", "node_modules"]

[build]
command = ""
output = "dist"
artifacts = []

[dependencies]

[dev-dependencies]

[scripts]
test = "bash tests/run_tests.sh"

[package.exports]
index = "src/index.kujo"
contract = "src/contract.kujo"
contracts = "src/contracts.kujo"
registry = "src/registry.kujo"
runtime = "src/runtime.kujo"
